name: Deploy (internal-tools platform)

# Deploys through the shared pipeline owned by immoscoop-internal-tools
# (ADR-021): push to main -> internal-tools PROD account, push to any other
# branch -> internal-tools DEV account. Build, ECS deploy, running-container
# verification and the SSM image-tag handoff all live there; this repo only
# says how to build its image (./Dockerfile). No AWS secrets needed.
#
#   dev:  https://semgraph.dev.internal-immoscoop.be
#   prod: https://semgraph.internal-immoscoop.be

on:
  push:
    branches: ["**"] # '**' matches nested branch names; tag pushes don't trigger

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: immoscoop-be/immoscoop-internal-tools/.github/workflows/deploy-app.yml@v1
    with:
      app: semgraph
