  references: Referenties
  query: Query
  metadata: Metadata
  askedBy: Gesteld door {name}
  builtBy: Uitgewerkt door
  compiledOn: Samengesteld op
  semgraph: Semgraph
  version: Versie

types:
  integer: een geheel getal
  number: een getal
  string: tekst
  array: een lijst
  object: een object
  boolean: waar of onwaar
  "null": leeg

issues:
  binsNotContiguous:
    message: "{field}: de bins moeten even breed zijn en op elkaar aansluiten: elk begint {width} na de vorige."
    alternative: Stuur elke bin vanaf de eerste, ook de lege (count 0).
  openBinOverlaps:
    message: De open bin begint voor de laatste bin eindigt.
    alternative: Laat de open bin beginnen bij of na het einde van de laatste bin.
  tooFewUnits:
    message: "De verdeling telt {count} eenheden. Kwartielen van minder dan {minimumPoints} zeggen weinig."
    alternative: Neem een langere periode of een ruimere groep.
  scopeRequired:
    message: "Zeg welke tijd de waarden dekken: window (een rollend venster van dagen), period (een ISO-kalenderperiode) of day (een momentopname), precies één."
    alternative: Voeg window, period of day toe.
  categoryIsDate:
    message: "{field}: {value} is een datum of een periode. Staven zijn voor categorieën; een datumas is altijd een lijn."
    alternative: Gebruik movingWindowAverage, calendarAverage of periodComparison voor het verloop in de tijd.
  tooManyCategories:
    message: "{count} geordende categorieën passen niet naast elkaar; hoogstens {max}."
    alternative: Groepeer de categorieën in minder klassen, of laat de volgorde weg zodat de staven liggen.
  tooFewCategories:
    message: "Maar {count} categorie heeft een waarde. Staven vergelijken categorieën; dat vraagt er minstens {minimumPoints}."
    alternative: Stuur meer categorieën, of toon de waarde alleen in een KPI-tegel.
  comparisonOnlyForSum:
    message: "Een vergelijking zit in één staaf, dus enkel bij een som; deze grafiek toont de {statistic}."
    alternative: Laat comparison en previous weg, of volg het gemiddelde of de mediaan in de tijd met periodComparison.
  kpiValueMissing:
    message: Het laatste blok heeft geen waarde, dus de tegel heeft geen getal om te tonen.
    alternative: Stuur de waarde van het laatste blok mee, of toon het verloop met periodComparison.
  kpiComparisonMissing:
    message: "Het laatste blok heeft geen waarde voor {label}: een getal zonder vergelijking zegt niets."
    alternative: Stuur previous mee voor het laatste blok, of kies de andere vergelijking.
  targetBeforeStart:
    message: De dag van het doel ligt voor de startdag.
    alternative: Geef een dag voor het doel na de startdag.
  pathSetOutsideKpi:
    message: Het pad is vastgelegd buiten de periode van de KPI.
    alternative: Geef in pathSet een dag tussen de start en het doel.
  periodOutsideKpi:
    message: "Periode {block} ligt buiten de KPI, van de start tot het doel."
    alternative: Stuur enkel de periodes van de start tot het doel.
  cumulativeDecreases:
    message: "De stand daalt in {block}: een stand sinds de start kan alleen stijgen."
    alternative: Stuur de cumulatieve stand op het einde van elke periode, niet het aantal per periode.
  pathBeforeSet:
    message: "Periode {block} heeft een geplande stand, maar het pad is pas vastgelegd op {date}."
    alternative: Stuur het pad vanaf de periode waarin het vastgelegd is; het verschuift nooit meer.
  cumulativeGap:
    message: Tussen de start en de laatste stand ligt een periode zonder stand, dus elke stand erna is onbekend.
    alternative: Stuur de stand van elke periode die voorbij is.
  pathIncomplete:
    message: "Periode {block} heeft geen geplande stand: het pad loopt van het moment dat het vastgelegd is ({date}) tot het doel."
    alternative: Stuur de geplande stand van elke periode van de planning tot het doel.
  noPreviousValues:
    message: "Geen enkele categorie heeft een waarde voor {label}, dus er is niets om mee te vergelijken."
    alternative: Stuur de vorige waarden mee, of laat comparison en previous weg.
  badRequest:
    message: "De aanvraag kon niet gelezen worden: {detail}"
    alternative: Stuur een JSON-object met Content-Type application/json.
  payloadTooLarge:
    message: De aanvraag is te groot.
    alternative: Stuur hoogstens 1000 blokken; meer heeft een grafiek nooit nodig.
  unsupportedMediaType:
    message: Enkel JSON-aanvragen worden aanvaard.
    alternative: Gebruik Content-Type application/json.
  notFound:
    message: Op {path} staat niets.
    alternative: GET /semgraphs toont wat er beschikbaar is.
  internalError:
    message: Er liep iets mis bij het maken van de grafiek. Dat ligt niet aan je aanvraag.
    alternative: Probeer opnieuw. Blijft het gebeuren, laat het dan weten aan het datateam.
  notAnObject:
    message: De aanvraag moet een JSON-object zijn.
  missingSemgraph:
    message: Zeg in het veld semgraph welke grafiek je wil.
    alternative: "Beschikbaar: {available}."
  unknownSemgraph:
    message: Er bestaat geen semgraph met de naam {value}.
    alternative: "Beschikbaar: {available}."
  plannedSemgraph:
    message: De semgraph {value} is gepland, maar nog niet beschikbaar.
    alternative: "Nu beschikbaar: {available}."
  missingField:
    message: Het veld {field} is verplicht.
  unexpectedField:
    message: Het veld {field} hoort niet bij deze semgraph.
    alternative: Laat het weg, of controleer de schrijfwijze in GET /semgraphs/{semgraph}.
  unexpectedBlockField:
    message: Een blok bevat enkel zijn naam en de velden van zijn statistiek; {field} is niet toegelaten.
    alternative: Laat de andere kolommen weg. Stuur nooit persoonsgegevens naar de grafiekserver.
  invalidValue:
    message: "{field} moet een van deze waarden zijn: {allowed}."
  invalidType:
    message: "{field} moet {expected} zijn."
  tooSmall:
    message: "{field} moet minstens {limit} zijn."
  tooLarge:
    message: "{field} mag hoogstens {limit} zijn."
  tooShort:
    message: "{field} moet minstens {limit} tekens hebben."
  tooLong:
    message: "{field} mag hoogstens {limit} tekens hebben."
  tooFew:
    message: "{field} moet minstens {limit} elementen bevatten."
  tooMany:
    message: "{field} mag hoogstens {limit} elementen bevatten."
  invalidFormat:
    message: "{field} heeft niet de verwachte vorm."
  invalidDate:
    message: "{field}: {value} is geen bestaande dag."
    alternative: Schrijf dagen als JJJJ-MM-DD.
  invalidPeriod:
    message: "{field}: {value} is geen geldige {unit}."
    alternative: Schrijf 2026-W40 voor een week, 2026-09 voor een maand, 2026-Q3 voor een kwartaal en 2026 voor een jaar.
  tooManyBlocks:
    message: "Van het eerste tot het laatste blok zijn er {count} blokken; een grafiek toont er hoogstens {max}."
    alternative: Stuur een kortere periode, of langere blokken.
  duplicateBlock:
    message: Het blok {block} komt meer dan eens voor.
    alternative: Stuur één rij per blok.
  windowsNotAligned:
    message: "{field}: het venster dat eindigt op {block} sluit niet aan op de andere. De einddagen moeten een veelvoud van {window} dagen uit elkaar liggen."
    alternative: Laat de vensters op elkaar volgen zonder overlap, elk van {window} dagen.
  fieldNotForStatistic:
    message: "{field} hoort niet bij de statistiek {statistic}."
    alternative: "Een blok bevat enkel de velden van zijn statistiek: mean met sd en n, median met p25, p75 en n, of sum."
  spreadIncomplete:
    message: "{field} heeft geen spreiding, terwijl andere blokken er wel een hebben."
    alternative: Geef de spreiding mee bij elk blok met een waarde, of bij geen enkel.
  spreadPartial:
    message: "{field} ontbreekt: P25 en P75 horen samen."
  spreadOrder:
    message: "{field}: P25, de mediaan en P75 moeten in die volgorde liggen."
  invalidUrl:
    message: "{field} moet een weblink zijn die begint met http:// of https://."
  invalidCharacters:
    message: "{field} bevat stuurtekens die niet getoond kunnen worden."
  formatNotAvailable:
    message: Het formaat {format} is nog niet beschikbaar; deze versie maakt enkel svg.
    alternative: Vraag het formaat svg.

  measureTypeNotAllowed:
    message: "Deze grafiek is niet gemaakt voor een maat van het type {measureType}: de grafiektaal legt ze enkel vast voor {allowed}."
    alternative: Gebruik een maat van het type {allowed}, of vraag aan het datateam welke semgraph past.
  perUnitNotSummable:
    message: "Een som van gemiddelden per eenheid betekent niets: een gemiddeld bedrag per lead tel je niet op over een week."
    alternative: Kies statistic mean of median.
  ratioNeedsNumerator:
    message: "Een verhouding, zoals gekwalificeerde leads op alle leads, heeft een teller en een noemer nodig. Dat contract komt er nog."
    alternative: Is het een gemiddelde per eenheid, zoals een bedrag per lead? Gebruik dan measureType perUnit.
  uniqueAggregationRequired:
    message: "Bij unieke aantallen moet je zeggen hoe ze geteld zijn: per dag (daily) of over het hele blok (overPeriod). Dat zijn twee verschillende metrics."
    alternative: Voeg uniqueAggregation daily of overPeriod toe.
  dailyUniquesNotSummable:
    message: Een som van dagelijkse unieken telt wie op meerdere dagen terugkomt meer dan eens.
    alternative: Tel de unieken per blok in het datawarehouse en geef uniqueAggregation overPeriod, of kies statistic mean voor het gemiddelde per dag.
  uniquesOverPeriodNotAveraged:
    message: "Unieken over een heel blok zijn één aantal per blok: er is geen gemiddelde per dag en geen spreiding om te tonen."
    alternative: Gebruik periodComparison met statistic sum voor de unieken per blok, of stuur de dagelijkse unieken met uniqueAggregation daily.
  blockAfterReference:
    message: "Het blok {block} loopt voorbij de laatste volledige dag ({day}), dus zijn waarde is nog niet definitief."
    alternative: Stuur enkel blokken tot de laatste volledige dag (een kalenderperiode mag nog lopen), of geef asOf mee als de data verder loopt.
  noData:
    message: Geen enkel blok heeft een waarde, dus er is niets om te tonen. Een blok zonder data telt nooit als nul.
    alternative: Stuur de waarden mee (0 waar er niets gebeurde).
  insufficientData:
    message: "De blokken met een waarde beslaan samen {count} dagen. Een betrouwbare grafiek vraagt er minstens {minimumPoints}."
    alternative: Stuur meer blokken.

  windowOrUnit:
    message: Geef ofwel window (rollende vensters) ofwel unit (kalenderperiodes), niet allebei en niet geen van beide.
  noComparisonData:
    message: "Er is niets om mee te vergelijken: geen enkel blok draagt de waarde van de periode vóór het scherm."
    alternative: Geef bij elk blok in previous de waarde van het blok ervoor.

  windowNotMultipleOf7:
    message: Een venster van {window} dagen is geen veelvoud van 7, dus niet elke weekdag telt even vaak mee. De grafiek wordt getekend, met een rode melding.
    alternative: Gebruik 7, 14, 28 of een ander veelvoud van 7.
    alert: "Lees deze grafiek met voorzichtigheid: een venster van {window} dagen is geen veelvoud van 7, dus niet elke weekdag telt even vaak mee. Een verschil tussen twee punten kan van de weekdagen komen."
  meanWithoutSpread:
    message: Het gemiddelde wordt getoond zonder spreiding, dus je ziet niet hoe ver de waarden uit elkaar liggen. De grafiek wordt getekend, met een rode melding.
    alternative: Geef sd mee bij elk blok.
    alert: "Lees deze grafiek met voorzichtigheid: dit gemiddelde staat zonder spreiding, dus je ziet niet hoe ver de waarden uit elkaar liggen. Twee periodes met hetzelfde gemiddelde kunnen heel verschillend zijn."
  medianWithoutSpread:
    message: De mediaan wordt getoond zonder spreiding (P25–P75), dus je ziet niet hoe ver de waarden uit elkaar liggen. De grafiek wordt getekend, met een rode melding.
    alternative: Geef p25 en p75 mee bij elk blok.
    alert: "Lees deze grafiek met voorzichtigheid: deze mediaan staat zonder spreiding (P25–P75), dus je ziet niet hoe ver de waarden uit elkaar liggen. Twee periodes met dezelfde mediaan kunnen heel verschillend zijn."
  nMissing:
    mean:
      message: Niet elk blok van dit gemiddelde zegt hoeveel waarnemingen erachter zitten (n). De grafiek wordt getekend, met een rode melding.
      alternative: Geef n mee bij elk blok.
      alert: "Lees deze grafiek met voorzichtigheid: bij dit gemiddelde staat niet hoeveel waarnemingen erachter zitten, dus je ziet niet welke punten op weinig waarnemingen steunen."
    median:
      message: Niet elk blok van deze mediaan zegt hoeveel waarnemingen erachter zitten (n). De grafiek wordt getekend, met een rode melding.
      alternative: Geef n mee bij elk blok.
      alert: "Lees deze grafiek met voorzichtigheid: bij deze mediaan staat niet hoeveel waarnemingen erachter zitten, dus je ziet niet welke punten op weinig waarnemingen steunen."
  fewObservations:
    mean:
      message: "{count} van de {total} {blocks} steunen op weinig waarnemingen. Ze krijgen stippels achter hun kolom en hun n onder de as."
      alert: "Lees deze grafiek met voorzichtigheid: weinig waarnemingen bij {count} van de {total} {blocks}, dus één uitschieter kan hun gemiddelde sterk verschuiven."
    median:
      message: "{count} van de {total} {blocks} steunen op weinig waarnemingen. Ze krijgen stippels achter hun kolom en hun n onder de as."
      alert: "Lees deze grafiek met voorzichtigheid: weinig waarnemingen bij {count} van de {total} {blocks}, dus hun mediaan is nog onzeker."

  localeFallback:
    message: Er zijn geen teksten voor {locale}, dus het Engels wordt gebruikt.
  uniqueAggregationIgnored:
    message: uniqueAggregation geldt enkel voor unieke aantallen en werd genegeerd.
  valuesAllTooDense:
    message: "Er zijn te veel punten om elke waarde op de grafiek te schrijven; de standaard ({values}) wordt gebruikt."
    alternative: Stuur minder blokken, of kies een grotere periode.
  valueAxisZoomIgnored:
    message: "Een hoeveelheid is een staaf, en een staaf begint bij nul: de waardeas zoomt niet in."
    alternative: Laat valueAxis weg; inzoomen is voor een gemiddelde of mediaan per categorie.
