    added: "deze periode: {value}"
    path: "pad: {value}"
    difference: "tegenover de geplande stap: {value}"
    planned: "nog erbij: {value}"
  difference: "verschil: {value}"
  spread:
    mean: "±1 sd: {sd}"
    median: "P25–P75: {p25}–{p75}"

