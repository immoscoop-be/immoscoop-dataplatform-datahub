  window: venster {range}
  running: "lopend: {count} van {total} dagen"
  noData: geen data
  runningShort: lopend
  kpi:
    shadow: "grijs = {label}"
  kpiStatus:
    target: "doel {value} · {date}"
    pathSet: "pad vastgelegd {date}"
    catchUp: incl. inhaal
    pace: "{value}/{unit}"
    per:
      week: wk
      month: mnd
      quarter: kw
    plan: "{catchUp} in {period} · daarna {pace}"
    planWeighted: "{catchUp} in {period} · daarna volgens het pad"
    lastStep: "{catchUp} in {period}"
    reached: doel bereikt
    above: "{value} boven het doel"
    missed: doel niet gehaald
  noComparison: geen vergelijking

hover:
