issues:
  binsNotContiguous:
    message: "{field}: the bins must be equally wide and touch: each starts {width} after the previous."
    alternative: Send every bin from the first one up, also the empty ones (count 0).
  openBinOverlaps:
    message: The open bin starts before the last bin ends.
    alternative: Let the open bin start at or after the end of the last bin.
  tooFewUnits:
    message: "The distribution holds {count} units. Quartiles of fewer than {minimumPoints} say little."
    alternative: Take a longer period or a wider group.
  scopeRequired:
    message: "Say which time the values cover: window (a rolling window of days), period (an ISO calendar period) or day (a snapshot), exactly one."
    alternative: Add window, period or day.
  categoryIsDate:
    message: "{field}: {value} is a date or a period. Bars are for categories; a date axis is always a line."
    alternative: Use movingWindowAverage, calendarAverage or periodComparison for the evolution in time.
  tooManyCategories:
    message: "{count} ordered categories do not fit next to each other; at most {max}."
    alternative: Group the categories into fewer ranges, or leave out the order so the bars lie down.
  tooFewCategories:
    message: "Only {count} category has a value. Bars compare categories; that takes at least {minimumPoints}."
    alternative: Send more categories, or show the value alone in a KPI tile.
  comparisonOnlyForSum:
    message: "A comparison lives inside one bar, so only for a sum; this chart shows the {statistic}."
    alternative: Leave out comparison and previous, or follow the mean or median over time in periodComparison.
  kpiValueMissing:
    message: The last block has no value, so the tile has no number to show.
    alternative: Send the value of the last block, or show the evolution in periodComparison.
  kpiComparisonMissing:
    message: "The last block has no value for {label}: a number without a comparison says nothing."
    alternative: Send previous for the last block, or choose the other comparison.
  targetBeforeStart:
    message: The target day lies before the start day.
    alternative: Give a target day after the start day.
  pathSetOutsideKpi:
    message: The path was set outside the period of the KPI.
    alternative: Give in pathSet a day between the start and the target.
  periodOutsideKpi:
    message: "Period {block} lies outside the KPI, from the start to the target."
    alternative: Send only the periods from the start to the target.
  cumulativeDecreases:
    message: "The level goes down in {block}: a level since the start can only go up."
    alternative: Send the cumulative level at the end of each period, not the amount per period.
  pathBeforeSet:
    message: "Period {block} has a planned level, but the path was only set on {date}."
    alternative: Send the path from the period in which it was set; it never moves afterwards.
  cumulativeGap:
    message: A period without a level lies between the start and the last level, so every level after it is unknown.
    alternative: Send the level of every period that is over.
  pathIncomplete:
    message: "Period {block} has no planned level: the path runs from the moment it was set ({date}) to the target."
    alternative: Send the planned level of every period from the plan to the target.
  noPreviousValues:
    message: "No category has a value for {label}, so there is nothing to compare with."
    alternative: Send the previous values, or leave out comparison and previous.
  # Input errors (400): the request itself is not valid.
  badRequest:
    message: "The request could not be read: {detail}"
    alternative: Send a JSON object with Content-Type application/json.
  payloadTooLarge:
    message: The request is too large.
    alternative: Send at most 1000 blocks; a chart never needs more.
  unsupportedMediaType:
    message: Only JSON requests are accepted.
    alternative: Use Content-Type application/json.
  notFound:
    message: There is nothing at {path}.
    alternative: GET /semgraphs lists what is available.
  internalError:
    message: Something went wrong while making the chart. This is not caused by your request.
    alternative: Try again. If it keeps happening, tell the data team.
  notAnObject:
    message: The request must be a JSON object.
  missingSemgraph:
    message: Say which chart you want in the field semgraph.
    alternative: "Available: {available}."
  unknownSemgraph:
    message: There is no semgraph called {value}.
    alternative: "Available: {available}."
  plannedSemgraph:
    message: The semgraph {value} is planned, but not available yet.
    alternative: "Available now: {available}."
  missingField:
    message: The field {field} is required.
  unexpectedField:
    message: The field {field} does not belong to this semgraph.
    alternative: Remove it, or check the spelling in GET /semgraphs/{semgraph}.
  unexpectedBlockField:
    message: A block carries only its name and the fields of its statistic; {field} is not allowed.
    alternative: Remove the other columns. Never send personal data to the chart service.
  invalidValue:
    message: "{field} must be one of: {allowed}."
  invalidType:
    message: "{field} must be {expected}."
  tooSmall:
    message: "{field} must be at least {limit}."
  tooLarge:
    message: "{field} must be at most {limit}."
  tooShort:
    message: "{field} must have at least {limit} characters."
  tooLong:
    message: "{field} must have at most {limit} characters."
  tooFew:
    message: "{field} must contain at least {limit} items."
  tooMany:
    message: "{field} must contain at most {limit} items."
  invalidFormat:
    message: "{field} does not have the expected form."
  invalidDate:
    message: "{field}: {value} is not an existing day."
    alternative: Write days as YYYY-MM-DD.
  invalidPeriod:
    message: "{field}: {value} is not a valid {unit}."
    alternative: Write 2026-W40 for a week, 2026-09 for a month, 2026-Q3 for a quarter and 2026 for a year.
  tooManyBlocks:
    message: "From the first block to the last there are {count} blocks; a chart shows at most {max}."
    alternative: Send a shorter period, or longer blocks.
  duplicateBlock:
    message: The block {block} occurs more than once.
    alternative: Send one row per block.
  windowsNotAligned:
    message: "{field}: the window ending on {block} does not line up with the others. The end days must lie a multiple of {window} days apart."
    alternative: Let the windows follow each other without overlap, each of {window} days.
  fieldNotForStatistic:
    message: "{field} does not belong to the statistic {statistic}."
    alternative: "A block carries only the fields of its statistic: mean with sd and n, median with p25, p75 and n, or sum."
  spreadIncomplete:
    message: "{field} has no spread, while other blocks have one."
    alternative: Give the spread with every block that has a value, or with none.
  spreadPartial:
    message: "{field} is missing: P25 and P75 go together."
  spreadOrder:
    message: "{field}: P25, the median and P75 must lie in that order."
  invalidUrl:
    message: "{field} must be a web link that starts with http:// or https://."
  invalidCharacters:
    message: "{field} contains control characters that cannot be shown."
  formatNotAvailable:
    message: The format {format} is not available yet; this version only makes svg.
    alternative: Ask for format svg.

  # Refusals (422): the chart would mislead, so it is not drawn.
  measureTypeNotAllowed:
    message: "This chart is not made for a measure of type {measureType}: the chart language defines it only for {allowed}."
    alternative: Use a measure of type {allowed}, or ask the data team which semgraph fits.
  perUnitNotSummable:
    message: "A total of means per unit means nothing: an average amount per lead does not add up over a week."
    alternative: Choose statistic mean or median.
  ratioNeedsNumerator:
    message: "A ratio, such as qualified leads out of all leads, needs a numerator and a denominator. That contract is still to come."
    alternative: Is it a mean per unit, such as an amount per lead? Then use measureType perUnit.
  uniqueAggregationRequired:
    message: "For unique counts, say how they were counted: per day (daily) or over the whole block (overPeriod). Those are two different metrics."
    alternative: Add uniqueAggregation daily or overPeriod.
  dailyUniquesNotSummable:
    message: A total of daily uniques counts someone who comes back on several days several times.
    alternative: Count the uniques over each block in the warehouse and give uniqueAggregation overPeriod, or choose statistic mean for the average per day.
  uniquesOverPeriodNotAveraged:
    message: "Uniques over a whole block are one count per block: there is no average per day and no spread to show."
    alternative: Use periodComparison with statistic sum for the uniques per block, or send the daily uniques with uniqueAggregation daily.
  blockAfterReference:
    message: "The block {block} runs past the last complete day ({day}), so its value is not final yet."
    alternative: Send only blocks up to the last complete day (a calendar period may still be running), or give asOf when the data runs further.
  noData:
    message: No block has a value, so there is nothing to show. A block without data never counts as zero.
    alternative: Send the values (0 where nothing happened).
  insufficientData:
    message: "The blocks with a value cover {count} days together. A reliable chart needs at least {minimumPoints}."
    alternative: Send more blocks.

  windowOrUnit:
    message: Give either window (rolling windows) or unit (calendar periods), not both and not neither.
  noComparisonData:
    message: "There is nothing to compare with: no block carries the value of the period before the screen."
    alternative: Give in previous, for every block, the value of the block before it.

  windowNotMultipleOf7:
    message: A window of {window} days is not a multiple of 7, so not every weekday counts equally often. The chart is drawn, with a red alert.
    alternative: Use 7, 14, 28 or another multiple of 7.
    alert: "Read this chart with care: a window of {window} days is not a multiple of 7, so not every weekday counts equally often. A difference between two points can come from the weekdays."
  meanWithoutSpread:
    message: The mean is shown without its spread, so you cannot see how far the values lie apart. The chart is drawn, with a red alert.
    alternative: Give sd with every block.
    alert: "Read this chart with care: this mean is shown without its spread, so you cannot see how far the values lie apart. Two periods with the same mean can be very different."
  medianWithoutSpread:
    message: The median is shown without its spread (P25–P75), so you cannot see how far the values lie apart. The chart is drawn, with a red alert.
    alternative: Give p25 and p75 with every block.
    alert: "Read this chart with care: this median is shown without its spread (P25–P75), so you cannot see how far the values lie apart. Two periods with the same median can be very different."
  nMissing:
    mean:
      message: Not every block of this mean says how many observations are behind it (n). The chart is drawn, with a red alert.
      alternative: Give n with every block.
      alert: "Read this chart with care: this mean does not say how many observations are behind it, so you cannot see which points rest on few observations."
    median:
      message: Not every block of this median says how many observations are behind it (n). The chart is drawn, with a red alert.
      alternative: Give n with every block.
      alert: "Read this chart with care: this median does not say how many observations are behind it, so you cannot see which points rest on few observations."
  fewObservations:
    mean:
      message: "{count} of the {total} {blocks} rest on few observations. Their columns get sparse dots and their n stands under the axis."
      alert: "Read this chart with care: few observations in {count} of the {total} {blocks}, so a single outlier can move their mean a lot."
    median:
      message: "{count} of the {total} {blocks} rest on few observations. Their columns get sparse dots and their n stands under the axis."
      alert: "Read this chart with care: few observations in {count} of the {total} {blocks}, so their median is still uncertain."

  localeFallback:
    message: There are no texts for {locale}, so English is used.
  uniqueAggregationIgnored:
    message: uniqueAggregation only applies to unique counts and was ignored.
  valuesAllTooDense:
    message: "There are too many points to write every value on the chart; the default ({values}) is used."
    alternative: Send fewer blocks, or choose a longer period.
  valueAxisZoomIgnored:
    message: "An amount is a bar, and a bar starts at zero: the value axis is not zoomed."
    alternative: Leave out valueAxis; zoom is for a mean or median per category.
