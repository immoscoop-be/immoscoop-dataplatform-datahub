# Base texts. Every key used by the service must exist here; other locales fall back to these.
semgraphs:
  kpiStatus:
    title: KPI status
    answers: Are we on track for the target, and what does it still take?
    examples:
      "1": Will we reach 130k leads by the end of the year, and how many do we need per month?
      "2": How far ahead or behind the plan are the new listings this quarter?
  kpiTile:
    title: KPI tile
    answers: How much is it now, and is that more or less than before?
    examples:
      "1": How many credit leads did we get in the last 28 days, compared with last year?
      "2": How long does a lead wait for a first contact this month?
  distribution:
    title: Distribution
    answers: How are the values spread, where does the middle lie and how long is the tail?
    examples:
      "1": How are the asking prices of the properties for sale spread?
      "2": How many properties cost more than € 500k?
  categoryComparison:
    title: Comparison between categories
    answers: Which category has the most, or the highest typical value?
    examples:
      "1": Which province brought the most leads in the last 28 days?
      "2": How long do properties stay online, per price range?
  movingWindowAverage:
    title: Moving window average
    answers: How does this evolve, without the daily noise?
    examples:
      "1": How have credit leads evolved over the last four weeks?
      "2": Is the number of new listings per day going up or down?
  movingWindowMedian:
    title: Moving window median
    answers: How does the typical day evolve, without being pulled along by a few outliers?
    examples:
      "1": How has the typical number of credit leads per day evolved over the last four weeks?
      "2": Is the typical asking price of new listings per day going up or down?
  calendarAverage:
    title: Average per calendar period
    answers: How much per day, on average, in each week, month, quarter or year?
    examples:
      "1": How many credit leads per day did we get on average, per month this year?
      "2": Was this week busier than the weeks before?
  periodComparison:
    title: Comparison with the previous period
    answers: Are we doing better or worse than in the period before?
    examples:
      "1": Did we get more or fewer credit leads in these 12 weeks than in the 12 weeks before?
      "2": Is the typical day of this half year higher than that of the half year before?
  calendarMedian:
    title: Median per calendar period
    answers: How much on a typical day, in each week, month, quarter or year?
    examples:
      "1": What was a typical day for credit leads, per quarter?
      "2": How did the typical time to first contact per day change per month?

attributes:
  timeAxis:
    question: Do you want to see how it evolves over time?
  breakdown:
    question: Do you want to break it down, and by what?
  comparisonBasis:
    question: What do you want to compare it with?
  dataGrain:
    question: Do you have totals or individual cases?
  partToWhole:
    question: Do the parts together make up the whole?
  accumulation:
    question: Do you want the pace per period, or the total so far?
  periodType:
    question: A rolling period (the last 7 days), or calendar periods (weeks, months)?
  centralTendency:
    question: Do you want the average or the median?

