<!DOCTYPE html>
<!--
  Screen: the ribbon of an environment that is not prod (designed on 2026-11-10, at the request of Max).
  uat looks the same as prod, with real colleagues and real data, so it is easy to forget where you are. Every
  environment but prod wears a ribbon with its name, on every screen, the sign-in included: uat, and local on a
  laptop. Prod wears nothing (DEC-UX-203). The ribbon floats over everything and never takes a click; the title of the
  tab begins with the name too, "uat · Data Hub — Collections", so that a tab among many says it, and a screen reader.
  The ribbon crosses the upper right corner of the window, in teal, clear of the actions in the head of a page. A band
  along the top edge and a tag under the mark in the rail were drawn too; Max chose the corner. The switch at the
  bottom shows uat (?rb=corner) and prod, without (?rb=prod). Any other prototype wears it with ?env=uat, such as
  sign-in.html?env=uat.
  Requirements: none yet; they follow once the design is approved.
  Decisions: DEC-UX-203, DEC-UX-130, DEC-UX-172.
  Rules: ../principles.md  ·  Placeholder content only.
-->
