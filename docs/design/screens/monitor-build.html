<!--
  Screen: building a Monitor for a business User, in seven steps (FR-CM-20, DEC-CM-23), drawn on 2026-11-07 from the
  brainstorm with Max. It takes the main area of the section Monitoring, not a sheet (OP-UX-65).
  Above the steps, the picture of the monitor (DEC-UX-195): a timeline, conceptual and not the data, that gains one layer
  per step, and under it the sentence that reads the monitor back. Each part of the sentence opens its step.
  1. Resource: those the User may manage, with the time Data Hub counts by, set by the Data Team (FR-CM-39).
  2. How often: every hour, day, week or month, at what time (FR-CM-21). Layer: a strip of tiles in that unit, days in
     whole weeks, M T W T F S S, with the weekend greyer, a dot per check, today hatched and the rest of the week to come.
  3. Period: the last one, or the last N, and when N, one by one or as one period (FR-CM-11). Layer: the block that
     looks back from the check, split when one by one.
  4. Per: all together or for each value, and which values; a new value comes in by itself and warms up first
     (FR-CM-07, FR-CM-08, FR-CM-10). Layer: colours in the block, three standing for many.
  5. Measure: per field, how to measure it, in business words, by the type of the field; a condition on one or more
     fields, built here; what a condition cannot say, a SQL measure of the Data Team in the monitor, in Data Hub, never a
     change in the dbt project (FR-CM-05, DEC-CM-25, DEC-CM-26). Layer: the measure on top.
  6. Boundaries: one or more, each compared with what the Owner chooses (DEC-CM-24); a fixed limit, a change, unusual,
     something new, something silent or the top N (FR-CM-12, FR-CM-24, OP-CM-10); a minimum to be judged (EC-CM-02);
     how often it would have warned in the past 12 weeks (FR-CM-16), explained (FR-CM-15); an exception for one value
     (FR-CM-09). Layer: what it is compared with, faded or dashed, and the boundaries as text beside.
  7. Reactions: per boundary, message me, in my list, tell the Consumers, block it (after the first version), and its
     tone (FR-CM-13, FR-CM-14); what a check reads (FR-CM-33). Layer: an icon per reaction.
  It starts from a proposal of Data Hub (FR-CM-22) or a draft of Claude from one sentence (FR-CM-23).
  The switches at the bottom: ?case=volume (the default), value, list, newgone or complete walks one of the five cases
  of the brainstorm through every step; ?step=resource (the default), often, period, per, measure, bounds or react;
  ?from=claude opens a draft of Claude.
  Requirements: FR-CM-03, FR-CM-05, FR-CM-07, FR-CM-08, FR-CM-09, FR-CM-10, FR-CM-11, FR-CM-12, FR-CM-13, FR-CM-14, FR-CM-15, FR-CM-16, FR-CM-20, FR-CM-21, FR-CM-22, FR-CM-23, FR-CM-24, FR-CM-33, FR-CM-39, EC-CM-02

    average: { label: 'average', sym: 'Ø', says: f => `the average ${f.name.toLowerCase()}` },
    total: { label: 'total', sym: 'Σ', add: true, says: f => `the total ${f.name.toLowerCase()}` },
    smallest: { label: 'smallest', sym: '↓', says: f => `the smallest ${f.name.toLowerCase()}` },
    largest: { label: 'largest', sym: '↑', says: f => `the largest ${f.name.toLowerCase()}` },
    empty: { label: 'how often empty', sym: '%', says: (f, r) => `the share of ${r.units} without ${f.name.toLowerCase()}` },
    distinct: { label: 'how many different', sym: '≠', says: f => `the number of different ${f.name.toLowerCase()} values` },
    share: { label: 'the share that meets it', sym: '%', says: (f, r) => `the share of ${r.units} where ${condTxt()}` }
  };
  const CASES = {
    volume: { q: 'I want to be informed about fluctuations in the volume per lead source, per day.', res: 'clc', often: 'day', on: 'all', period: 7, split: true, per: 'source', field: 'rows', how: 'count', guard: 10,
      hist: 'In the past 12 weeks it would have messaged you <b>3 times for partner_api</b>, and 9 times across all lead sources; the Consumers would have heard once, on 2 November.',
      bounds: [ { kind: 'change', dir: 'drops', amt: 30, ref: 'prev', refLen: 28, tone: 'attention', react: ['owner'] },
                { kind: 'change', dir: 'drops', amt: 50, ref: 'prev', refLen: 28, tone: 'attention', react: ['owner', 'consumers'] },
                { kind: 'change', dir: 'rises', amt: 50, ref: 'prev', refLen: 28, tone: 'informative', react: ['owner'] } ] },
    value: { q: 'I want to know when the requested amount per lead source shifts.', res: 'clc', often: 'week', on: 'Monday', period: 1, split: false, per: 'source', field: 'amount', how: 'typical', guard: 30,
      hist: 'In the past 12 weeks it would have put <b>partner_api twice</b> in your list, and 5 lead sources in all.',
      bounds: [ { kind: 'change', dir: 'rises or drops', amt: 10, ref: 'prev', refLen: 8, tone: 'informative', react: ['list'] } ] },
    list: { q: 'Which estate agents are growing strongly?', res: 'listings', often: 'week', on: 'Monday', period: 4, split: true, per: 'agent', field: 'rows', how: 'count', guard: 10,
      hist: 'In the past 12 weeks your list would have held <b>14 estate agents a week</b> on average, from 9 to 22.',
      bounds: [ { kind: 'change', dir: 'rises', amt: 20, atLeast: 10, ref: 'prev', refLen: 4, tone: 'opportunity', react: ['list'] } ] },
    newgone: { q: 'Tell me when a new lead source appears, or one goes silent.', res: 'clc', often: 'day', on: 'all', period: 1, split: false, per: 'source', field: 'rows', how: 'count', guard: 0,
      hist: 'In the past 12 weeks: <b>2 new lead sources</b>, partner_api_v2 and walk_in, and one that went silent, app, from 1 to 4 October.',
      bounds: [ { kind: 'appears', ref: 'ever', tone: 'informative', react: ['owner'] },
                { kind: 'silent', weeks: 12, ref: 'past', tone: 'attention', react: ['owner'] } ] },
    complete: { q: 'Tell me when leads come in that we cannot contact: no email and no phone.', res: 'clc', often: 'day', on: 'all', period: 1, split: false, per: 'partner', field: 'cond', how: 'share', guard: 20, cond: { join: 'all', parts: [{ f: 'Email', op: 'is empty' }, { f: 'Phone', op: 'is empty' }] },
      hist: 'In the past 12 weeks it would have messaged you <b>4 times for Belfius</b>, and 6 times across all partners; above 10% only once.',
      bounds: [ { kind: 'level', dir: 'higher', amt: 2, unit: '%', ref: 'fixed', tone: 'attention', react: ['owner'] },
                { kind: 'level', dir: 'higher', amt: 10, unit: '%', ref: 'fixed', tone: 'problem', react: ['owner', 'consumers'] } ] }
  };
  const STEPS = ['resource', 'often', 'period', 'per', 'measure', 'bounds', 'react'];
  const NAMES = ['Resource', 'How often', 'Period', 'Per', 'Measure', 'Boundaries', 'Reactions'];
  const U = { hour: ['hour', 'hours', 'the last hour', 'now'], day: ['day', 'days', 'yesterday', 'today'], week: ['week', 'weeks', 'last week', 'this week'], month: ['month', 'months', 'last month', 'this month'] };
  const PERIODS = { hour: [1, 3, 6, 24], day: [1, 7, 14, 28], week: [1, 4, 8, 13], month: [1, 3, 6, 12] };
  const REACT = {
    owner: { icon: 'ph-chat-circle-text', label: 'Message me', says: () => 'message me', desc: r => `${r.team[0].toUpperCase() + r.team.slice(1)}, in Data Hub and by e-mail` },
    list: { icon: 'ph-list-bullets', label: 'In my list', says: () => `put it in my ${s.often === 'week' || s.often === 'month' ? 'weekly' : 'daily'} list`, desc: () => 'Together, rather than one by one: a list to read' },
    consumers: { icon: 'ph-megaphone', label: 'Tell the Consumers', says: () => 'tell the Consumers', desc: r => `The Users of its Lenses; ${r.name} shows it while it lasts` },
    block: { icon: 'ph-lock', label: 'Block it', says: r => `block ${r.name}`, desc: () => 'No longer served until you lift it · after the first version' }
  };
  const TONES = { opportunity: ['ph-sparkle', 'Opportunity'], informative: ['ph-info', 'Informative'], attention: ['ph-warning-circle', 'Attention'], problem: ['ph-warning-octagon', 'Problem'] };

  const q = new URLSearchParams(location.search);
  const copy = o => JSON.parse(JSON.stringify(o));
  let caseKey = CASES[q.get('case')] ? q.get('case') : 'volume';
  const OPS = ['is empty', 'is not empty', 'is', 'is not', 'is higher than', 'is lower than'];
  const needsValue = op => !op.includes('empty');
  const load = k => { const c = copy(CASES[k]); if (!c.cond) c.cond = { join: 'all', parts: [{ f: RES[c.res].condFields[0], op: 'is empty' }] }; return c; };
  let s = load(caseKey);
  let at = Math.max(1, STEPS.indexOf(q.get('step')) + 1);
  let reached = at;
  let from = q.get('from') === 'claude' ? 'claude' : 'proposal';

  const res = () => RES[s.res];
  const per = () => (s.per !== 'none' && res().per[s.per]) || null;
  const field = () => res().fields.find(f => f.k === s.field) || res().fields[0];
  const how = () => HOW[s.how] || HOW.count;
  const u = () => U[s.often];
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const condTxt = () => s.cond.parts.map(c => `${c.f.toLowerCase()} ${c.op}${needsValue(c.op) ? ' ' + (c.v || '…') : ''}`).join(s.cond.join === 'all' ? ' and ' : ' or ');
  const later = l => l > at ? ' cv-later' : '';
  const a = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

  // ---- words ------------------------------------------------------------------------------------------------
  const lenTxt = n => s.often === 'day' && n % 7 === 0 ? `${n / 7} week${n > 7 ? 's' : ''}` : `${n} ${n === 1 ? u()[0] : u()[1]}`;
  const refTxt = b => b.ref === 'prev' ? `the ${lenTxt(b.refLen)} before` : b.ref === 'weekday' ? 'a usual Monday, over the 4 weeks before' : b.ref === 'others' ? `all ${per() ? per().many : 'of them'} together` : '';
  const oftenTxt = () => s.often === 'hour' ? 'Every hour' : s.often === 'day' ? (s.on === 'weekdays' ? 'Every weekday at 08:00' : 'Every day at 08:00') : s.often === 'week' ? `Every ${s.on || 'Monday'} at 08:00` : 'On the 1st of every month at 08:00';
  const periodTxt = () => s.period === 1 ? u()[2] : `the last ${s.period} ${u()[1]}` + (s.split ? `, ${u()[0]} by ${u()[0]}` : '');
  const perTxt = () => per() ? `per ${per().one}` : 'all together';
  const avgTxt = () => s.period > 1 && s.split && how().add ? `, on average per ${u()[0]}` : '';
  const amtTxt = b => b.unit === '%' ? `${b.amt}%` : `${b.amt} ${res().units}`;
  const bTxt = b => {
    const p = per();
    if (b.kind === 'change') return `it ${b.dir} ${b.amt}%` + (b.atLeast ? ` and by at least ${b.atLeast} ${res().units}` : '') + ` compared with ${refTxt(b)}`;
    if (b.kind === 'level') return `it is ${b.dir} than ${amtTxt(b)}`;
    if (b.kind === 'unusual') return `it is the ${b.dir} in ${b.weeks} weeks`;
    if (b.kind === 'appears') return `${a(p ? p.one : 'value')} appears for the first time`;
    if (b.kind === 'silent') return `${a(p ? p.one : 'value')} stays silent for longer than ever in ${b.weeks} weeks`;
    return `${a(p ? p.one : 'value')} is among the ${b.n} that rose most compared with ${refTxt(b)}`;
  };
  const bShort = b => {
    const p = per();
    if (b.kind === 'change') return `${b.dir} ${b.amt}%` + (b.atLeast ? `, +${b.atLeast}` : '');
    if (b.kind === 'level') return `${b.dir} than ${amtTxt(b)}`;
    if (b.kind === 'unusual') return `${b.dir} in ${b.weeks} weeks`;
    if (b.kind === 'appears') return a('new ' + (p ? p.one : 'value'));
    if (b.kind === 'silent') return a('silent ' + (p ? p.one : 'value'));
    return `the top ${b.n} risers`;
  };
  const reactTxt = b => {
    const parts = b.react.map(k => REACT[k].says(res()));
    return parts.length ? parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts.slice(-1) : parts[0] : 'only keep it in the Log';
  };

  // ---- the picture: a calendar strip of tiles, conceptual, not the data (DEC-UX-195) ---------------------------
  // Days come in whole weeks, Monday to Sunday, with a gap between weeks; today is the Tuesday of the last week.
  function layout() {
    const P = s.period;
    if (s.often === 'day') { const weeks = Math.min(9, Math.max(4, Math.ceil((2 * P + 2) / 7) + 1)); return { P, day: true, weeks, N: weeks * 7, now: (weeks - 1) * 7 + 1 }; }
    const N = Math.min(60, Math.max({ hour: 24, week: 14, month: 13 }[s.often], 2 * P + 2));
    return { P, day: false, N, now: N - 1 };
  }
  const colOf = (L, j) => L.day ? j + Math.floor(j / 7) + 1 : j + 1;
  const span = (L, a, b) => `${colOf(L, a)} / ${colOf(L, b) + 1}`;
  const template = L => L.day ? Array.from({ length: L.weeks }, () => 'repeat(7, minmax(0, 1fr))').join(' 10px ') : `repeat(${L.N}, minmax(0, 1fr))`;
  const label = (L, j) => {
    if (L.day) { const w = j % 7; return { t: 'MTWTFSS'[w], off: w >= 5 }; }
    const back = L.now - j;
    if (s.often === 'week') return { t: 'w' + (45 - back) };
    if (s.often === 'hour') { const h = ((9 - back) % 24 + 24) % 24; return { t: String(h).padStart(2, '0'), off: h < 7 || h >= 20 }; }
    return { t: 'JFMAMJJASOND'[((10 - back) % 12 + 12) % 12] };
  };
  function picture() {
    const L = layout(), P = L.P, c1 = L.now - 1, c0 = c1 - P + 1, split = s.split && P > 1;
    if (reached < 2) return `<div class="cv-empty" style="grid-column:1 / -1">The picture of your monitor builds up here, one layer per step.</div>`;
    const stripes = () => reached >= 4 && per() ? `<i class="cv-stripes${later(4)}">${[3, 2, 1].map(k => `<span style="background:var(--seg-${k})"></span>`).join('')}</i>` : '';
    // a period drawn as tiles, one by one, or as one merged pill, with its frame
    const period = (a, b, cls, frame) => {
      let t = '';
      if (split || a === b) for (let j = a; j <= b; j++) { if (j < 0) continue; t += `<div class="cv-tile ${cls}${label(L, j).off ? ' off' : ''}" style="grid-column:${colOf(L, j)}">${stripes()}</div>`; }
      else t += `<div class="cv-tile ${cls}" style="grid-column:${span(L, Math.max(0, a), b)}">${stripes()}</div>`;
      return t + `<div class="cv-frame ${frame}" style="grid-column:${span(L, Math.max(0, a), b)}"></div>`;
    };
    let h = '';
    // 1 · the strip: weekends and nights greyer, a dot per check, today hatched, the rest of this week still to come
    if (L.day) for (let w = 0; w < L.weeks; w++) h += `<div class="cv-off${later(2)}" style="grid-column:${span(L, w * 7 + 5, w * 7 + 6)}"></div>`;
    for (let j = 0; j < L.N; j++) {
      const lb = label(L, j), when = j === L.now ? ' now' : j > L.now ? ' future' : '';
      const check = !(s.often === 'day' && s.on === 'weekdays' && lb.off);
      h += `<div class="cv-tile${lb.off ? ' off' : ''}${when}${later(2)}" style="grid-column:${colOf(L, j)}"></div>`;
      h += `<div class="cv-tick${lb.off ? ' off' : ''}${later(2)}" style="grid-column:${colOf(L, j)}">${lb.t}${check ? `<span class="dot${j >= L.now ? ' next' : ''}"></span>` : ''}</div>`;
    }
    h += `<div class="cv-now-label${later(2)}" style="grid-column:${colOf(L, L.now)}">${u()[3]}</div>`;
    // 6 · what it is compared with: the periods before, dashed and faded; a longer past as a pale frame
    if (reached >= 6) {
      const seen = new Set(), bands = [];
      s.bounds.forEach(b => {
        const key = b.ref + (b.refLen || '') + (b.weeks || '');
        if (seen.has(key)) return; seen.add(key);
        if (b.ref === 'prev') {
          const n = Math.max(1, Math.round(b.refLen / P)); let a = c0 - P, k = 0;
          while (k < n && a >= 0) { h += period(a, a + P - 1, 'ref' + later(6), 'ref' + later(6)); a -= P; k++; }
          h += `<div class="cv-cap${later(6)}" style="grid-column:${span(L, Math.max(0, a + P), c0 - 1)}">compared with ${refTxt(b)}${k < n ? ' …' : ''}</div>`;
        } else if (b.ref === 'weekday') {
          for (let a = c0 - 7; a >= 0; a -= 7) h += period(a, a, 'ref' + later(6), 'ref' + later(6));
          h += `<div class="cv-cap${later(6)}" style="grid-column:${span(L, 0, c0 - 1)}">compared with ${refTxt(b)}</div>`;
        } else if (b.ref === 'ever' || b.ref === 'past') bands.push(b.ref === 'ever' ? 'everything before' : `the ${b.weeks} weeks before`);
      });
      if (bands.length && c0 > 0) h += `<div class="cv-frame band${later(6)}" style="grid-column:${span(L, 0, c0 - 1)}"></div><div class="cv-cap${later(6)}" style="grid-column:${span(L, 0, c0 - 1)}">compared with ${bands.join(' · ')}</div>`;
    }
    // 2, 3, 4 · the period looked back over, framed, one by one or merged, in colours per value
    if (reached >= 3) h += period(c0, c1, 'in' + later(3), later(3));
    // 6 · a fixed limit: a dashed line across the strip
    if (reached >= 6) s.bounds.filter(b => b.ref === 'fixed').sort((x, y) => y.amt - x.amt).slice(0, 3).forEach((b, k) => {
      h += `<div class="cv-fixed${later(6)}" style="grid-column:${span(L, 0, c1)};margin-top:${10 + k * 18}px"><span>${amtTxt(b)}</span></div>`;
    });
    // 5 · the measure on top
    if (reached >= 5) {
      const sym = how().sym;
      if (split) for (let j = c0; j <= c1; j++) h += `<div class="cv-m${later(5)}" style="grid-column:${colOf(L, j)}">${sym}</div>`;
      else h += `<div class="cv-m${later(5)}" style="grid-column:${span(L, c0, c1)}" title="${esc(how().label)}">${c1 - c0 + 1 < 3 ? sym : sym + ' ' + esc(how().label.split(',')[0])}</div>`;
    }
    return h;
  }
  function side() {
    if (reached < 6) return `<div class="label cv-later">Boundaries</div><div class="meta cv-later" style="display:block;line-height:1.5">They show here, with their reactions, from step 6.</div>`;
    return `<div class="label${later(6)}">Boundaries</div>` + s.bounds.map(b =>
      `<div class="cv-b${later(6)}">${reached >= 7 ? `<span class="tone-dot${later(7)}" data-tone="${b.tone}"></span>` : ''}<span class="grow">${esc(bShort(b))}</span>` +
      (reached >= 7 ? `<span class="cv-r${later(7)}">${b.react.map(k => `<i class="ph ${REACT[k].icon}" title="${REACT[k].label}"></i>`).join('')}</span>` : '') + '</div>').join('');
  }
  function sentence() {
    const part = (l, html, step) => `<button class="cv-part${later(l)}" data-act="jump:${step}">${html}</button>`;
    let t = reached >= 2 ? part(2, oftenTxt(), 'often') + ', look at ' : 'Look at ';
    if (reached >= 5) t += part(5, esc(how().says(field(), res())), 'measure') + ' in ';
    t += part(1, res().name, 'resource');
    if (reached >= 4) t += ', ' + part(4, perTxt(), 'per');
    if (reached >= 3) t += ', over ' + part(3, periodTxt(), 'period');
    if (reached >= 5 && avgTxt()) t += part(5, avgTxt(), 'measure');
    t += '.';
    if (reached >= 6) {
      s.bounds.forEach(b => { t += ' When ' + part(6, esc(bTxt(b)), 'bounds') + (reached >= 7 ? ': ' + part(7, reactTxt(b), 'react') : '') + '.'; });
      if (per() && s.guard) t += ' ' + part(6, `${a(per().one)[0].toUpperCase() + a(per().one).slice(1)} with fewer than ${s.guard} ${res().units} in the period is not judged.`, 'bounds');
    }

  }

  // ---- the steps --------------------------------------------------------------------------------------------
  const chip = (on, act, html) => `<button class="seg${on ? ' on' : ''}" data-act="${act}">${html}</button>`;
  const sel = (key, val, opts) => `<select class="cv-sel" data-set="${key}">${opts.map(([v, l]) => `<option value="${v}"${String(v) === String(val) ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const head = (h2, lead) => `<h2>${h2}</h2><p class="meta" style="display:block;line-height:1.5;margin:0 0 14px">${lead}</p>`;
  const foot = text => `<div class="build-foot"><p class="meta">${text}</p>` +
    (at > 1 ? '<button class="btn-quiet" data-act="go:-1">Back</button>' : '') +
    (at < 7 ? `<button class="btn-primary" data-act="go:1">Next: ${NAMES[at].toLowerCase()}<i class="ph ph-arrow-right" style="font-size:15px"></i></button>` : '<a class="btn-primary" href="monitor.html" style="text-decoration:none">Save monitor</a>') + '</div>';

  const steps = {
    resource: () => head('Which Resource?', 'The Resources of your Owner Units. A Resource has one monitor: to one that has it already, you add what to watch.') +
      Object.entries(RES).map(([k, r]) => `<button class="pick cv-pick${s.res === k ? ' on' : ''}" data-act="res:${k}"><span style="flex:1"><span class="item-title">${r.name}</span><span class="meta" style="display:block;margin-top:2px">${r.coll} · ${r.level} · ${r.status}</span></span></button>`).join('') +
      `<ul class="wh-steps" style="margin-top:12px"><li><i class="ph-fill ph-clock"></i><span>Data Hub counts ${res().name} by <span class="mono">${res().time}</span>, ${res().timeText}. The Data Team set this for it; you do not choose it.</span></li></ul>` +
      foot(`${res().name} · next, how often you want to hear of it`),
    often: () => head('How often do you want to hear of it?', `Each check looks at what came in since the one before. The picture now counts in ${u()[1]}.`) +
      `<div class="rule-form"><div class="field"><span>Check it</span><div class="mc-chips" style="margin:2px 0 0">${['hour', 'day', 'week', 'month'].map(k => chip(s.often === k, 'often:' + k, 'every ' + k)).join('')}</div></div>` +
      (s.often !== 'hour' ? `<label class="field"><span>At</span>${sel('at', '08:00', [['08:00', '08:00'], ['07:00', '07:00'], ['09:00', '09:00']])}</label>` : '') +
      (s.often === 'day' ? `<div class="field"><span>On</span><div class="mc-chips" style="margin:2px 0 0">${chip(s.on !== 'weekdays', 'on:all', 'every day')}${chip(s.on === 'weekdays', 'on:weekdays', 'weekdays only')}</div></div>` : '') +
      (s.often === 'week' ? `<label class="field"><span>On</span>${sel('on', s.on || 'Monday', [['Monday', 'Monday'], ['Tuesday', 'Tuesday'], ['Friday', 'Friday']])}</label>` : '') + '</div>' +
      `<div class="explain"><i class="ph-fill ph-bell" aria-hidden="true"></i><div>Whether you hear of it at once or in a list, you choose per boundary, in the last step. The dots on the timeline are the checks.</div></div>` +
      foot(`${oftenTxt()} · next, which period each check looks at`),
    period: () => head('Which period does each check look at?', 'From the moment of the check, back in time.') +
      `<div class="field"><span>Look back over</span><div class="mc-chips" style="margin:2px 0 0">${PERIODS[s.often].map(n => chip(s.period === n, 'period:' + n, n === 1 ? u()[2][0].toUpperCase() + u()[2].slice(1) : `the last ${n} ${u()[1]}`)).join('')}</div></div>` +
      (s.period > 1 ? `<div class="field" style="margin-top:12px"><span>Look at it</span><div class="mc-chips" style="margin:2px 0 0">${chip(s.split, 'split:on', `${u()[0]} by ${u()[0]}`)}${chip(!s.split, 'split:off', 'as one period')}</div></div>` : '') +
      `<ul class="wh-steps" style="margin-top:14px"><li><i class="ph-fill ph-clock-countdown"></i><span>${s.period === 1 ? u()[2][0].toUpperCase() + u()[2].slice(1) + ' means' : 'The last one is'} the last complete ${u()[0]}: ${res().name} is complete up to yesterday, so the check at 08:00 on Tuesday looks at Monday. The hatched ${u()[3]} is still coming in.</span></li></ul>` +
      foot(`Over ${periodTxt()} · next, all together or for each`),
    per: () => {
      const p = res().per;
      return head('All together, or for each?', 'For each, every boundary judges a value against its own history: a small lead source is not judged against a large one.') +
        `<div class="field"><span>Look at it</span><div class="mc-chips" style="margin:2px 0 0">${chip(!per(), 'per:none', 'all together')}${Object.entries(p).map(([k, v]) => chip(s.per === k, 'per:' + k, `for each ${v.one} <span class="count">${v.n}</span>`)).join('')}</div></div>` +
        (per() ? `<label class="field" style="max-width:360px;margin-top:12px"><span>Which ${per().many}</span>${sel('only', 'all', [['all', `All ${per().many}, also new ones`], ['some', 'Only some…']])}</label>` : '') +
        `<div class="explain" style="margin-top:14px"><i class="ph-fill ph-stack-simple" aria-hidden="true"></i><div>${per() ? `Each ${per().one}, and all together as well: so a boundary can say "${per().first} dropped while the total did not". A new ${per().one} comes in by itself, and is judged once it has 4 weeks of history. The picture shows three colours; they stand for ${per().n}.` : 'All together: one number per period. Choose for each to judge every value on its own.'}</div></div>` +
        foot(`${per() ? `For each ${per().one}` : 'All together'} · next, what to measure`);
    },
    measure: () => head('What do you want to measure?', 'Per field, how to measure it, in the words that fit its type. Pick one; you can watch more later, in the same monitor.') +
      res().fields.map(f => `<div class="cv-field${s.field === f.k ? ' on' : ''}"><div class="cv-field-head"><b style="font-weight:500">${f.name}</b><span class="meta">${f.type}</span></div><div class="mc-chips" style="margin:0">${f.hows.map(k => chip(s.field === f.k && s.how === k, `measure:${f.k}:${k}`, HOW[k].label)).join('')}</div>` +
        (f.k === 'cond' && s.field === 'cond' ? `<div class="cv-cond">Count the ${res().units} where ${sel('cj', s.cond.join, [['all', 'all'], ['any', 'any']])} of these hold:</div>` +
          s.cond.parts.map((c, i) => `<div class="cv-cond-row">${sel(`c:${i}:f`, c.f, res().condFields.map(x => [x, x]))}${sel(`c:${i}:op`, c.op, OPS.map(o => [o, o]))}${needsValue(c.op) ? `<input class="cv-sel" data-set="c:${i}:v" value="${esc(c.v || '')}" placeholder="a value" style="width:130px">` : ''}${s.cond.parts.length > 1 ? `<button class="icon-btn" data-act="cdel:${i}" aria-label="Take it out"><i class="ph ph-x"></i></button>` : ''}</div>`).join('') +
          `<div class="cv-cond-row"><button class="btn-quiet" data-act="cadd"><i class="ph ph-plus"></i>Another field</button></div>` : '') + '</div>').join('') +
      (s.period > 1 && s.split ? `<ul class="wh-steps" style="margin-top:12px"><li><i class="ph-fill ph-calendar-dots"></i><span>${how().add ? `${u()[0][0].toUpperCase() + u()[0].slice(1)} by ${u()[0]}: it takes the average per ${u()[0]}, so the last ${s.period} ${u()[1]} compare with any other ${s.period}.` : `A ${how().label.split(',')[0]} is taken over the whole period at once; ${u()[0]} by ${u()[0]} only shows in the picture.`}</span></li></ul>` : '') +
      (s.how === 'typical' ? `<div class="explain" style="margin-top:12px"><i class="ph-fill ph-scales" aria-hidden="true"></i><div><b>Typical, the middle value,</b> is proposed for amounts: half of them are lower, half higher. One very large one does not move it, as it moves the average.</div></div>` : '') +
      `<div class="explain" style="margin-top:12px"><i class="ph-fill ph-code" aria-hidden="true"></i><div><b>Something a condition cannot say,</b> such as "converted within 30 days"? <a href="messages.html">Ask the Data Team</a>: they write it as a SQL measure in this monitor, here in Data Hub, and you use it like any other. Nothing changes in the dbt project of ${res().name}.</div></div>` +
      foot(`${how().says(field(), res())[0].toUpperCase() + how().says(field(), res()).slice(1)} · next, when to hear of it`),
    bounds: () => {
      const p = per();
      const refOpts = b => [[`prev:${s.period * 4}`, `the ${lenTxt(s.period * 4)} before`], [`prev:${s.period * 8}`, `the ${lenTxt(s.period * 8)} before`]]
        .concat(s.often === 'day' && s.period === 1 ? [['weekday', 'a usual Monday']] : []).concat(p ? [['others', `all ${p.many} together`]] : []);
      const refVal = b => b.ref === 'prev' ? `prev:${b.refLen}` : b.ref;
      const row = (b, i) => {
        let mid = '';
        if (b.kind === 'change') mid = `it ${sel(`b:${i}:dir`, b.dir, [['rises', 'rises'], ['drops', 'drops'], ['rises or drops', 'rises or drops']])} ${sel(`b:${i}:amt`, b.amt, [10, 20, 30, 50].map(v => [v, v + '%']))} compared with ${sel(`b:${i}:ref`, refVal(b), refOpts(b).some(o => o[0] === refVal(b)) ? refOpts(b) : [[refVal(b), refTxt(b)]].concat(refOpts(b)))}, and by at least ${sel(`b:${i}:atLeast`, b.atLeast || 0, [[0, '–'], [5, 5], [10, 10], [20, 20]])} ${res().units}`;
        else if (b.kind === 'level') mid = `it is ${sel(`b:${i}:dir`, b.dir, [['higher', 'higher'], ['lower', 'lower']])} than ${sel(`b:${i}:amt`, b.amt, (b.unit === '%' ? [1, 2, 5, 10, 20] : [1, 5, 10, 50, 100]).map(v => [v, b.unit === '%' ? v + '%' : v]))} ${b.unit === '%' ? '' : res().units}, a fixed number`;
        else if (b.kind === 'unusual') mid = `it is the ${sel(`b:${i}:dir`, b.dir, [['lowest', 'lowest'], ['highest', 'highest']])} in ${sel(`b:${i}:weeks`, b.weeks, [[8, 8], [12, 12], [26, 26]])} weeks`;
        else if (b.kind === 'appears') mid = `${a(p ? p.one : 'value')} appears for the first time, compared with everything before`;
        else if (b.kind === 'silent') mid = `${a(p ? p.one : 'value')} stays silent for longer than ever in ${sel(`b:${i}:weeks`, b.weeks, [[8, 8], [12, 12], [26, 26]])} weeks`;
        else mid = `${a(p ? p.one : 'value')} is among the ${sel(`b:${i}:n`, b.n, [[5, 5], [10, 10], [20, 20]])} that rose most, compared with ${sel(`b:${i}:ref`, refVal(b), refOpts(b))}`;
        return `<div class="cv-brow"><span class="cv-n">${i + 1}</span><span>When</span> ${mid}<button class="icon-btn" data-act="del:${i}" aria-label="Take it out"><i class="ph ph-x"></i></button></div>`;
      };
      const fresh = s.bounds.some(b => b.kind === 'appears' || b.kind === 'silent');
      return head('When do you want to hear of it?', 'One or more boundaries, each compared with what you choose. The words follow the comparison: against a fixed number it is higher or lower than; against the past it rises or drops.') +
        (p ? `<div class="cv-guard">Judge ${a(p.one)} only when it had at least ${sel('guard', s.guard, [[0, 0], [10, 10], [20, 20], [30, 30], [50, 50]])} ${res().units} in the period <span class="meta">· proposed from its history, so that 3 becoming 1 is no −66%</span></div>` : '') +
        s.bounds.map(row).join('') +
        `<div class="field" style="margin-top:12px"><span>Add a boundary</span><div class="mc-chips" style="margin:2px 0 0">${[['change', 'a change'], ['level', 'a fixed limit'], ['unusual', 'unusual'], ['appears', 'something new'], ['silent', 'something silent'], ['top', 'the top N']].map(([k, l]) => chip(false, 'add:' + k, '<i class="ph ph-plus" style="font-size:12px"></i> ' + l)).join('')}</div></div>` +
        (fresh ? `<ul class="wh-steps" style="margin-top:12px"><li><i class="ph-fill ph-hourglass-medium"></i><span>Something new and something silent judge ${a(p ? p.one : 'value')} at once, without the 4 weeks of warm-up the other boundaries wait for.</span></li></ul>` : '') +
        `<div class="label" style="margin-top:18px">How often it would have warned you</div><p style="font-size:var(--text-small);line-height:1.55;margin:4px 0 8px">${CASES[caseKey].hist}</p>` +
        `<div class="hist">${document.getElementById('hist-chart').innerHTML}</div>` +
        `<div class="chart-legend"><span><i class="sw" style="background:color-mix(in srgb,var(--tone-attention) 16%,transparent)"></i>within the first boundary</span><span><i class="sw" style="height:0;border-top:1px dashed var(--text-muted)"></i>what it is compared with</span><span><i class="sw" style="width:9px;height:9px;border-radius:50%;background:var(--tone-attention)"></i>would have warned you</span></div>` +
        `<div class="explain" style="margin-top:12px"><i class="ph-fill ph-graduation-cap" aria-hidden="true"></i><div><b>Unusual</b> asks no number: "the lowest in 12 weeks" fires when a value drops below everything it did in those weeks. <a href="learning-card.html">Reading your own figures</a></div></div>` +
        (p ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn-quiet"><i class="ph ph-plus"></i>An exception for one ${p.one}</button></div>` : '') +
        foot(`${s.bounds.length} boundar${s.bounds.length === 1 ? 'y' : 'ies'} · next, what should happen`);
    },
    react: () => head('What should happen?', `Per boundary, one or more reactions, and the tone in which you see it. Every finding is also kept in the Log of ${res().name}, whatever you choose.`) +
      s.bounds.map((b, i) => `<div class="cv-react"><div class="cv-react-head"><span class="cv-n">${i + 1}</span><span>When ${esc(bTxt(b))}</span></div>` +
        `<div class="cv-togs">${Object.entries(REACT).map(([k, r]) => `<button class="cv-tog${b.react.includes(k) ? ' on' : ''}" data-act="react:${i}:${k}"${k === 'block' ? ' disabled' : ''}><i class="ph ${r.icon}" aria-hidden="true"></i><b style="font-weight:500">${r.label}</b><span class="meta">${r.desc(res())}</span></button>`).join('')}</div>` +
        `<div class="cv-tones">${Object.entries(TONES).map(([t, [ic, l]]) => `<button class="tone" data-tone="${t}" data-act="tone:${i}:${t}" style="border:0;cursor:pointer;${b.tone === t ? `outline:1.5px solid var(--tone-${t})` : 'opacity:.55'}"><i class="ph-fill ${ic}"></i>${l}</button>`).join('')}</div></div>`).join('') +
      `<ul class="wh-steps" style="margin-top:14px"><li><i class="ph-fill ph-gauge"></i><span>Each check reads about <b style="font-weight:500">${res().reads}</b>, within the free range of 100 MB. Its first one reads the past 12 weeks once, for the history it compares with.</span></li></ul>` +
      foot(`Saved, the first active boundary makes ${res().name} 5 · Monitored`)
  };

  // ---- render and events ------------------------------------------------------------------------------------
  function render() {
    const cv = document.getElementById('cv');
    cv.style.gridTemplateColumns = template(layout());
    cv.innerHTML = picture();
    document.getElementById('cv-side').innerHTML = side();
    document.getElementById('sentence').innerHTML = sentence();
    document.getElementById('step-body').innerHTML = steps[STEPS[at - 1]]();
    document.getElementById('title').textContent = `Monitor of ${res().name}`;
    document.getElementById('drafted').innerHTML = from === 'claude'
      ? `<i class="ph-fill ph-sparkle" aria-hidden="true"></i><div><b style="font-weight:500">Drafted by Claude</b> from what you asked: <q>${CASES[caseKey].q}</q> Check each step; nothing is saved until you save it here.</div>`
      : `<i class="ph-fill ph-lightbulb" aria-hidden="true"></i><div><b style="font-weight:500">A proposal of Data Hub,</b> from what it knows of ${res().name}: its EDA, its Stability and the types of its fields. Look through each step and change what does not fit your question.</div>`;
    document.querySelectorAll('[data-group="step"] [data-target]').forEach((b, i) => { b.classList.toggle('on', i === at - 1); b.classList.toggle('done', i < reached && i !== at - 1); b.setAttribute('aria-selected', i === at - 1); });
  }
  const goStep = n => { at = Math.min(7, Math.max(1, n)); reached = Math.max(reached, at); render(); document.querySelector('.build-steps').scrollIntoView({ block: 'nearest' }); };
  document.querySelectorAll('[data-group="step"] [data-target]').forEach((b, i) => b.addEventListener('click', () => goStep(i + 1)));
  document.querySelectorAll('[data-group="case"] [data-target]').forEach(b => b.addEventListener('click', () => { caseKey = b.dataset.target; s = load(caseKey); render(); }));
  document.querySelectorAll('[data-group="from"] [data-target]').forEach(b => b.addEventListener('click', () => { from = b.dataset.target; render(); }));
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const [k, x, y] = a.dataset.act.split(':');
    if (k === 'go') return goStep(at + Number(x));
    if (k === 'jump') return goStep(STEPS.indexOf(x) + 1);
    if (k === 'res') { if (s.res !== x) s.cond = { join: 'all', parts: [{ f: RES[x].condFields[0], op: 'is empty' }] }; s.res = x; const p = Object.keys(RES[x].per); if (!RES[x].per[s.per]) s.per = p[0]; if (!RES[x].fields.some(f => f.k === s.field)) { s.field = 'rows'; s.how = 'count'; } }
    if (k === 'often') { s.often = x; s.period = 1; s.split = false; s.on = x === 'week' ? 'Monday' : 'all'; s.bounds.forEach(b => { if (b.ref === 'prev') b.refLen = 4; if (b.ref === 'weekday') { b.ref = 'prev'; b.refLen = 4; } }); }
    if (k === 'on') s.on = x;
    if (k === 'period') { s.period = Number(x); if (s.period === 1) s.split = false; s.bounds.forEach(b => { if (b.ref === 'prev') b.refLen = s.period * 4; if (b.ref === 'weekday' && s.period > 1) { b.ref = 'prev'; b.refLen = s.period * 4; } }); }
    if (k === 'split') s.split = x === 'on';
    if (k === 'per') s.per = x;
    if (k === 'measure') { s.field = x; s.how = y; }
    if (k === 'del') s.bounds.splice(Number(x), 1);
    if (k === 'cadd') s.cond.parts.push({ f: res().condFields[Math.min(s.cond.parts.length, res().condFields.length - 1)], op: 'is empty' });
    if (k === 'cdel') s.cond.parts.splice(Number(x), 1);
    if (k === 'add') s.bounds.push({ change: { kind: 'change', dir: 'drops', amt: 30, ref: 'prev', refLen: s.period * 4 }, level: { kind: 'level', dir: 'higher', amt: 10, unit: s.how === 'count' ? '' : '%', ref: 'fixed' }, unusual: { kind: 'unusual', dir: 'lowest', weeks: 12, ref: 'past' }, appears: { kind: 'appears', ref: 'ever' }, silent: { kind: 'silent', weeks: 12, ref: 'past' }, top: { kind: 'top', n: 10, ref: 'prev', refLen: s.period * 4 } }[x]);
    if (k === 'add') Object.assign(s.bounds[s.bounds.length - 1], { tone: 'attention', react: ['owner'] });
    if (k === 'react') { const b = s.bounds[Number(x)]; b.react = b.react.includes(y) ? b.react.filter(r => r !== y) : b.react.concat(y); }
    if (k === 'tone') s.bounds[Number(x)].tone = y;
    render();
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-set]'); if (!el) return;
    const [k, i, f] = el.dataset.set.split(':'), v = el.value, num = Number(v);
    if (k === 'guard') s.guard = num;
    else if (k === 'on') s.on = v;
    else if (k === 'cj') s.cond.join = v;
    else if (k === 'c') s.cond.parts[Number(i)][f] = v;
    else if (k === 'b') {
      const b = s.bounds[Number(i)];
      if (f === 'ref') { const [r, n] = v.split(':'); b.ref = r; if (n) b.refLen = Number(n); }
      else b[f] = isNaN(num) ? v : num;
    } else return;
    render();
  });
  document.querySelector(`[data-group="case"] [data-target="${caseKey}"]`)?.classList.add('on');
  render();
})();
</script>
</body>
</html>
