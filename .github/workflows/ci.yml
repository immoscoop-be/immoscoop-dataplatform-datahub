name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check code, tests and scripts
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Check requirement IDs, statuses and links
        run: pnpm docs:check
