name: images

# Builds one image per service on every pull request, to prove it builds.
# On main, the images are pushed to Artifact Registry, tagged with the commit SHA (TR-PF-15),
# once the GCP connection is configured as repository variables (docs/architecture/build-and-deploy.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation: GitHub proves its identity to GCP, no stored keys

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, catalogue, registry, query]
    env:
      PUSH: ${{ github.event_name == 'push' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      REPOSITORY: ${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the image name
        id: image
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "tag=$REGISTRY/$REPOSITORY/$SERVICE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=datahub/$SERVICE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: env.PUSH == 'true'
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ steps.image.outputs.tag }}
          push: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
